<div class="main">
  <div class="search-content">
    <p-inputgroup>
      <input pInputText placeholder="Qidirish" />
      <p-inputgroup-addon>
        <p-button icon="pi pi-search" severity="secondary" variant="text" />
      </p-inputgroup-addon>
    </p-inputgroup>
  </div>
  <div class="category-content">
    <p-selectbutton
      styleClass="w-full"
      class="w-full"
      [options]="categories()"
      optionLabel="label"
      optionValue="value"
      aria-labelledby="basic"
    />
    <!-- [(ngModel)]="value" -->
  </div>
</div>
